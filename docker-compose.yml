version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cic-postgres
    environment:
      POSTGRES_DB: cic_insights
      POSTGRES_USER: cic_admin
      POSTGRES_PASSWORD: cic_secret_2025
    ports:
      - "5432:5432"
    volumes:
      - cic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cic_admin -d cic_insights"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cic_pgdata:
